<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A2E8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- 玻璃效果 -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <ellipse cx="100" cy="60" rx="60" ry="20" fill="rgba(255,255,255,0.2)"/>
  
  <!-- Y 字母 -->
  <g transform="translate(100,100)">
    <!-- 左上到中心 -->
    <path d="M -30,-40 L 0,0" stroke="white" stroke-width="12" stroke-linecap="round"/>
    <!-- 右上到中心 -->
    <path d="M 30,-40 L 0,0" stroke="white" stroke-width="12" stroke-linecap="round"/>
    <!-- 中心向下 -->
    <path d="M 0,0 L 0,40" stroke="white" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- 装饰点 -->
  <circle cx="40" cy="40" r="4" fill="rgba(255,255,255,0.6)"/>
  <circle cx="160" cy="50" r="3" fill="rgba(255,255,255,0.5)"/>
  <circle cx="150" cy="150" r="5" fill="rgba(255,255,255,0.4)"/>
</svg>
