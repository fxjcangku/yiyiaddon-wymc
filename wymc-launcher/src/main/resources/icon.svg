<svg width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="letter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 圆角矩形背景 -->
  <rect width="256" height="256" rx="64" fill="url(#bg)"/>
  
  <!-- 外发光效果 -->
  <rect x="32" y="32" width="192" height="192" rx="48" fill="none" stroke="#60a5fa" stroke-width="4" opacity="0.3"/>
  
  <!-- 字母 Y -->
  <text x="128" y="180" font-family="Arial, sans-serif" font-size="140" font-weight="bold" fill="url(#letter)" text-anchor="middle">Y</text>
  
  <!-- 小方块装饰（Minecraft 风格） -->
  <rect x="200" y="200" width="24" height="24" fill="#10b981" opacity="0.8"/>
  <rect x="176" y="200" width="20" height="20" fill="#34d399" opacity="0.6"/>
</svg>
